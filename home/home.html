<div id="home-sections-container">
    <section id="home">
        <div class="home-section">Home</div>
    </section>
    %__HOME_SECTIONS__%
    <section id="timeline" class="home-section-container fade hide">
        <div class="home-section">Timeline</div>
    </section>
    <section id="end" class="home-section-end"></section>
</div>
<div class="home-scrollbar-container">
    <div class="home-scrollbar" id="home-scrollbar">Scrollbar</div>
    <div class="scroll-anchors-container" id="scroll-anchors-container">
        <div class="scroll-anchor" id="scroll-anchor-start-padding"></div>
        %__SCROLL_ANCHORS__%
    </div>
</div>

<script type="module" defer>
    import initScrollFunctions from "/scripts/scroll.js";
    
    const scrollBehaviorData = %__SCROLL_BEHAVIOR_DATA__%;

    document.addEventListener("DOMContentLoaded", () => {
        initScrollFunctions(scrollBehaviorData);
    }, { once: true });
</script>
