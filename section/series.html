<section
    id="%__SERIES_ID__%"
    class="section-series-container"
    style="--index: %__SERIES_INDEX__%;"
>
    <div class="position-relative flex-stack p-m">
        <div class="section-series-body">
            <div class="section-series-text">
                <div class="fs-m"><h3 class="heading-inline">%__SERIES_TITLE</h3><span>(%__SERIES_COUNT__%)</span></div>
                <div class="text-secondary fs-l">%__SERIES_YEARSPAN__%</div>
                <p>%__SERIES_DESCRIPTION__%</p>
            </div>
            <img src="/assets/artworks/%__SERIES_THUMBNAIL__%" class="section-series-thumbnail" />
        </div>
        <a href="/series/%__SERIES_ID__%" class="fs-m align-end overlay-link">↳ see all</a>
    </div>
</section>
