<main class="artwork-main" id="artwork">
    <div class="artwork-container artwork-layout">
        <div class="artwork-heading">
            <h2 class="artwork-title heading-inline">%__ARTWORK_TITLE__%</h2>
            <span class="artwork-date text-secondary">%__ARTWORK_DATE__%</span>
        </div>
        <div class="artwork-media-container artwork-media-interact"></div>
        <div class="artwork-control-close">
            <a href="/artworks/#%__ARTWORK_ID__%" class="artwork-control close-button"></a>
        </div>
        <div class="series-artwork-index-container d-none">
            <div class="series-artwork-index"></div>
            <div class="series-artwork-count"></div>
        </div>
        <div class="artwork-control-container artwork-control-zoom">
            <div class="artwork-control-text">
                <div>Zoom on Hover</div>
                <div class="artwork-control-display control-zoom-display">None <span class="info-hover-container"
                    ><div class="info-hover">JavaScript must be enabled</div></span
                ></div>
            </div>
            <button class="artwork-control artwork-control-button-left control-zoom-out disabled"></button>
            <button class="artwork-control artwork-control-button-right control-zoom-in disabled"></button>
        </div>
        <div class="artwork-control-container artwork-control-layer">
            <div class="artwork-control artwork-control-button-left control-layer-up"></div>
            <div class="artwork-control artwork-control-button-right control-layer-down"></div>
        </div>
        <div class="artwork-control-scroll artwork-control-scroll-left">
            <a
                href="/artworks/%__ARTWORK_LEFT_ID__%/"
                class="artwork-control control-artwork-left %__ARTWORK_LEFT_CLASS__%"
            ></a>
        </div>
        <div class="artwork-control-scroll artwork-control-scroll-right">
            <a
                href="/artworks/%__ARTWORK_RIGHT_ID__%/"
                class="artwork-control control-artwork-right %__ARTWORK_RIGHT_CLASS__%"
            ></a>
        </div>
    </div>
    %__ARTWORK_LAYERS__%
</main>

<script type="module" defer>
    import initArtwork from "/scripts/artwork.js";

    const artworkId = "%__ARTWORK_ID__%";
    const artworksData = JSON.parse('%__ARTWORKS_DATA__%');

    initArtwork(artworkId, artworksData);
</script>
