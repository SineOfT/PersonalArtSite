<video
    class="artwork-media"
    autoplay
    loop
    muted
    playsinline
    disablepictureinpicture
    disableremoteplayback
    x-webkit-airplay="deny"
>
    <source src="/assets/artworks/%__LAYER_MEDIA__%" type="video/mp4" />
    <span>
        Your browser doesn't support HTML video. Go to the next layer to see the still artwork.
    </span>
</video>
