<div class="artwork-layout" id="%__LAYER_ID__%">
    <div class="artwork-image-container">
        <img
            src="/assets/artworks/%__LAYER_IMAGE__%"
            class="artwork-image"
            loading="lazy"
        />
    </div>
    <div class="artwork-control-layer">
        <div class="artwork-control-container">
            <div class="artwork-control-text">
                <div>Process Layer</div>
                <div class="artwork-control-display">%__LAYER_CURR__% / %__LAYER_COUNT__%</div>
            </div>
            <a
                href="#%__LAYER_UP__%"
                class="artwork-control artwork-control-button-left control-layer-up hidden %__LAYER_UP_CLASS__%"
            ></a>
            <a
                href="#%__LAYER_DOWN__%"
                class="artwork-control artwork-control-button-right control-layer-down hidden %__LAYER_DOWN_CLASS__%"
            ></a>
        </div>
    </div>
</div>
