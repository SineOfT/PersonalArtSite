<div class="artwork-layout" id="layer-%__LAYER_ID__%">
    <div class="artwork-media-container">
        %__LAYER_MEDIA_CONTENT__%
    </div>
    <div class="artwork-control-layer">
        <div class="artwork-control-container">
            <div class="artwork-control-text">
                <div>Process Layer</div>
                <div class="artwork-control-display">%__LAYER_CURR__% / %__LAYER_COUNT__%</div>
            </div>
            <a
                href="#layer-%__LAYER_UP__%"
                class="artwork-control artwork-control-button-left control-layer-up %__LAYER_UP_CLASS__%"
            ></a>
            <a
                href="#layer-%__LAYER_DOWN__%"
                class="artwork-control artwork-control-button-right control-layer-down %__LAYER_DOWN_CLASS__%"
            ></a>
        </div>
    </div>
</div>
