<div class="search-banner p-m">
    <span class="js-disabled-display ft-italic">JavaScript must be enabled to enable search functionality</span>
    <form method="get" id="search-form" class="v-none">
        <div class="flex-row-stretch pb-m">
            <input type="text" name="search" class="search-input flex-item-main" placeholder="Search" />
            <button type="submit" class="search-btn">Search</button>
        </div>
        <div class="flex-row-wrap">
            <div class="py-m">
                <input type="checkbox" name="exclude-sketches" id="exclude-sketches-check" class="exclude-sketches-check" />
                <label for="exclude-sketches-check">Exclude sketches</label>
            </div>
            <fieldset class="section-checkboxes">
                <legend>In section</legend>
                %__SECTIONS_CHECKBOXES__%
            </fieldset>
            <fieldset class="series-checkboxes">
                <legend>In series</legend>
                %__SERIES_CHECKBOXES__%
            </fieldset>
            <div class="py-m">
                <div class="flex-row">
                    <label for="date-range-select">Date Range: </label>
                    <select name="date-range" id="date-range-select" class="date-range-select flex-grow">
                        <option value="">None</option>
                        <option value="last-month">Within last month</option>
                        <option value="last-6-months">Within last 6 months</option>
                        <option value="last-year">Within last year</option>
                        <option value="range">Between range</option>
                    </select>
                </div>
                <div class="date-from-to-select-container py-s v-none">
                    <input type="date" name="date-from" class="date-from-select" />
                    &ndash;
                    <input type="date" name="date-to"   class="date-to-select" />
                </div>
            </div>
        </div>
    </form>
</div>

<div class="px-l fs-s">
    <span class="artwork-count">%__ARTWORK_COUNT__%</span>
    artwork<span class="artwork-count-plural">%__ARTWORK_COUNT_PLURAL__%</span> matched your search
</div>

%__ARTWORKS_LIST__%

<script type="module" defer>
    import initArtworksSearch from "/scripts/artworks-search.js";

    const artworksData = JSON.parse('%__ARTWORKS_DATA__%');

    initArtworksSearch(artworksData);
</script>
