<div class="scroll-animations-container">
    <div id="shika" class="shika-sprite">
        <div id="shika-head"      class="shika-sprite"></div>
        <div id="shika-ear"       class="shika-sprite"></div>
        <div id="shika-eye-left"  class="shika-sprite"></div>
        <div id="shika-eye-right" class="shika-sprite"></div>
        <div id="shika-tail"      class="shika-sprite"></div>
    </div>
</div>
<div class="home-scrollbar-container">
    <div class="home-scrollbar" id="home-scrollbar">Scrollbar</div>
    <div class="scroll-anchors-container" id="scroll-anchors-container">
        %__SCROLL_ANCHORS__%
    </div>
</div>

<script type="module" defer>
    import initScrollFunctions from "/scripts/scroll.js";
    import initShikaStateMachine from "/scripts/shika.js";
    import initStateMachineManager from "/scripts/state-machine-manager.js";

    const scrollData = %__SCROLL_DATA__%;

    document.addEventListener("DOMContentLoaded", () => {
        initScrollFunctions(scrollData);
        const shikaStateMachine = initShikaStateMachine();
        initStateMachineManager([shikaStateMachine]);
    }, { once: true });
</script>
