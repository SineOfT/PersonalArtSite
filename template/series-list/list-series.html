<section
    id="%__SERIES_ID__%"
    class="list-series-container frag-anchor"
    style="--index: %__SERIES_INDEX__%;"
    data-screen-fr="0.5"
    data-anchor="0.5"
>
    <div class="position-relative flex-stack gap-s">
        <div class="list-series-body gapx-m">
            <div class="list-series-text">
                <div class="fs-m"><h3 class="heading-inline">%__SERIES_TITLE</h3><span>(%__SERIES_COUNT__%)</span></div>
                <div class="text-secondary fs-l">%__SERIES_DATE_SPAN__%</div>
                <p>%__SERIES_DESCRIPTION__%</p>
            </div>
            <div class="list-series-thumbnail">
                %__SERIES_THUMBNAIL__%
            </div>
        </div>
        <a href="/series/%__SERIES_ID__%" class="fs-m align-end overlay-link">↳ see all</a>
    </div>
</section>
