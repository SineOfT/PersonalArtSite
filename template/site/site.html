<div class="header-tint"></div>
<div class="footer-tint"></div>
<header id="header">
    <div class="header-container">
        <div class="header-body flex-row-between p-m">
            <div class="header-content">
                <h1 class="header-heading"><a href="/" class="anchor-unstyled">
                    Shyuu's Art Website
                </a></h1>
                <nav class="header-nav">
                    <a href="/series/" class="anchor-unstyled fs-s">Series</a>
                    <a href="/artworks/?exclude-sketches=on" class="anchor-unstyled fs-s">Artworks</a>
                    <button class="header-btn toggle-animations-btn"></button>
                </nav>
            </div>
        </div>
        <input type="checkbox" id="header-toggle-button" class="header-toggle-button" />
        <label for="header-toggle-button" class="toggle-button-label"></label>
    </div>
    %__BREADCRUMBS__%
</header>
<script type="module" src="/scripts/site.js"></script>

<main id="site-main">
    %__SITE_MAIN__%
</main>

<footer id="footer">
    %__SITE_SCROLL__%
    <div class="footer-body">
        <div class="footer-content">
            <div class="footer-text">
                <h2 class="v-none">Info</h2>
                %__SITE_FOOTER_TEXT__%
            </div>
            <div>
                <div class="pb-xxl">
                    <h2 class="fs-s">Contact</h2>
                    <ul class="contact-list">
                        <li>
                            <svg class="contact-icon"><use href="/assets/site/email-icon.svg" /></svg>
                            Email: <a href="mailto:shyuuart@gmail.com">shyuuart@gmail.com</a>
                        </li>
                        <li>
                            <svg class="contact-icon"><use href="/assets/site/insta-icon.svg" /></svg>
                            Insta: <a href="https://instagram.com/shyuu_art" target="_blank">@shyuu_art</a>
                        </li>
                    </ul>
                </div>
                <h2 class="fs-s"><a href="/sitemap">Site Map</a></h2>
            </div>
        </div>
    </div>
</footer>
